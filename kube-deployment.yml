# -----------------------------------------------------------------------------
# Setup (einmalig)
# -----------------------------------------------------------------------------
# 1) Namespace anlegen
# kubectl apply -f kube-deployment.yml
#
# 2) Registry Secret ist im Manifest enthalten.
#    Bitte vor Deploy den Token im Secret-Block unten setzen
#    (password + auth).
#
# 3) App-Env Secret aus .env erzeugen
# kubectl create secret generic restaurant-env \
#   --from-env-file=.env \
#   -n restaurant \
#   --dry-run=client -o yaml | kubectl apply -f -
#
# 4) Deploy
# kubectl apply -f kube-deployment.yml
# -----------------------------------------------------------------------------

---
apiVersion: v1
kind: Namespace
metadata:
  name: restaurant

---
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-registry-key
  namespace: restaurant
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "registry.shitlab.dev": {
          "username": "jowin202",
          "password": "PLEASE_SET_GITLAB_TOKEN",
          "auth": "am93aW4yMDI6UExFQVNFX1NFVF9HSVRMQUJfVE9LRU4="
        }
      }
    }

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: restaurant-mongo-pvc
  namespace: restaurant
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurant-app
  namespace: restaurant
  labels:
    app: restaurant-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: restaurant-app
  template:
    metadata:
      labels:
        app: restaurant-app
    spec:
      imagePullSecrets:
        - name: gitlab-registry-key
      containers:
        - name: mongodb
          image: public.ecr.aws/docker/library/mongo:7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
        - name: web
          # Bitte auf dein gebautes Image anpassen:
          image: registry.shitlab.dev/jowin202/restaurant:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: restaurant-env
          env:
            - name: MONGODB_URI
              value: mongodb://localhost:27017
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: mongo-storage
          persistentVolumeClaim:
            claimName: restaurant-mongo-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: restaurant-service
  namespace: restaurant
spec:
  type: ClusterIP
  selector:
    app: restaurant-app
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: restaurant-ingress
  namespace: restaurant
spec:
  # ingressClassName: nginx
  rules:
    - host: fressen.shitlab.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: restaurant-service
                port:
                  number: 80
