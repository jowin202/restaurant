<h2 mat-dialog-title>Bestellung konfigurieren</h2>

<mat-dialog-content>
  <p class="item-title">{{ data.itemName }}</p>

  <form [formGroup]="form" class="dialog-form">
    @for (attr of data.attributes; track attr) {
      <div class="field-row">
        @switch (attr.input_type) {
          @case ('string') {
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>{{ attr.label }}</mat-label>
              <input matInput [formControlName]="attr.key" />
            </mat-form-field>
          }
          @case ('select') {
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>{{ attr.label }}</mat-label>
              <mat-select [formControlName]="attr.key">
                @for (option of attr.options; track option) {
                  <mat-option [value]="option">{{ option }}</mat-option>
                }
              </mat-select>
            </mat-form-field>
          }
          @case ('boolean') {
            <mat-checkbox [formControlName]="attr.key">
              {{ attr.label }}
            </mat-checkbox>
          }
        }
      </div>
    }
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Abbrechen</button>
  <button mat-flat-button color="primary" type="button" (click)="submit()">Übernehmen</button>
</mat-dialog-actions>
