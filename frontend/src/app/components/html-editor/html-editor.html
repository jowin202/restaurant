<div class="html-editor" [class.disabled]="disabled">
  <div class="toolbar">
    <button type="button" mat-icon-button [disabled]="disabled" (click)="exec('bold')" aria-label="Fett">
      <mat-icon>format_bold</mat-icon>
    </button>
    <button type="button" mat-icon-button [disabled]="disabled" (click)="exec('italic')" aria-label="Kursiv">
      <mat-icon>format_italic</mat-icon>
    </button>
    <button type="button" mat-icon-button [disabled]="disabled" (click)="exec('underline')" aria-label="Unterstreichen">
      <mat-icon>format_underlined</mat-icon>
    </button>

    <span class="separator"></span>

    <button type="button" mat-icon-button [disabled]="disabled" (click)="formatParagraph()" aria-label="Absatz">
      <mat-icon>notes</mat-icon>
    </button>
    <button type="button" mat-icon-button [disabled]="disabled" (click)="formatHeading()" aria-label="Überschrift">
      <mat-icon>title</mat-icon>
    </button>

    <span class="separator"></span>

    <button type="button" mat-icon-button [disabled]="disabled" (click)="exec('insertUnorderedList')" aria-label="Aufzählung">
      <mat-icon>format_list_bulleted</mat-icon>
    </button>
    <button type="button" mat-icon-button [disabled]="disabled" (click)="exec('insertOrderedList')" aria-label="Nummerierte Liste">
      <mat-icon>format_list_numbered</mat-icon>
    </button>
    <button type="button" mat-icon-button [disabled]="disabled" (click)="insertLink()" aria-label="Link einfügen">
      <mat-icon>link</mat-icon>
    </button>

    <span class="toolbar-spacer"></span>

    <button type="button" mat-button [disabled]="disabled" (click)="clear()">Leeren</button>
  </div>

  <div
    #editor
    class="editor"
    [style.min-height]="minHeight"
    [attr.contenteditable]="disabled ? 'false' : 'true'"
    [attr.data-placeholder]="placeholder"
    (input)="onInput()"
    (blur)="onBlur()"
  ></div>
</div>
